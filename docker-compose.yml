services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Northline_Demo123"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__Provider: SqlServer
      Database__ConnectionString: "Server=sqlserver,1433;Database=northline;User Id=sa;Password=Northline_Demo123;TrustServerCertificate=True;Encrypt=True"
      Jwt__Issuer: northline-inventory
      Jwt__Audience: northline-inventory
      Jwt__SigningKey: northline-compose-signing-key-change-me
      Jwt__ExpiryMinutes: "480"
      Seed__Enabled: "true"
    ports:
      - "5080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Api__BaseUrl: http://api:8080/
    ports:
      - "5081:8080"
    depends_on:
      - api
