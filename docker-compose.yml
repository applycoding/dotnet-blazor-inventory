services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Stockroom-demo-9!"
    ports:
      - "1433:1433"
    volumes:
      - stockroom-sql:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DatabaseProvider: SqlServer
      ConnectionStrings__SqlServer: "Server=db,1433;Database=Stockroom;User Id=sa;Password=Stockroom-demo-9!;TrustServerCertificate=True;Connect Timeout=5"
      Jwt__Key: "dev-only-change-me-stockroom-demo-key-32b"
      Jwt__Issuer: stockroom
      Jwt__Audience: stockroom
    depends_on:
      db:
        condition: service_healthy

volumes:
  stockroom-sql:
